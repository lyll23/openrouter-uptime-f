name: poll

on:
  schedule:
    # Nominal 15-minute cadence, with the existing 12-minute duplicate guard.
    # GitHub can delay/drop scheduled events. This does not guarantee cadence.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/poll.yml"
      - "scripts/poll.py"
      - "scripts/should_poll.py"
  workflow_run:
    # A failed independent alarm can recover one missed window. This cannot
    # loop: liveness does not listen to poll, and data pushes match no paths.
    workflows: [liveness]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Poll even if the last one was recent"
        type: boolean
        default: false

# Never let two runs commit at once.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    # Never consume a triggering run's code/artifacts. Recovery uses only this
    # repository's default branch and its existing contents:write permission.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Keep a small margin below the nominal 15-minute cadence so delayed
      # attempts are not needlessly suppressed.
      MIN_INTERVAL_MIN: "12"

    steps:
      - uses: actions/checkout@v4
        with:
          # Sparse checkout automatically fetches with blob:none. Historical
          # archives/CSVs are not needed to append today's observation.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /status/
            /README.md
            /.gitignore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is a poll due?
        id: guard
        env:
          FORCE_POLL: ${{ inputs.force }}
        run: |
          # Include both dates in case the run crosses UTC midnight. Existing
          # rows for either date must be materialized before poll.py appends.
          today="$(date -u +%F)"
          tomorrow="$(date -u -d "${today} +1 day" +%F)"
          for day in "$today" "$tomorrow"; do
            git sparse-checkout add "/derived/${day}.csv" "/raw/${day}/"
          done
          # Refresh the whole selected snapshot before writing, not just
          # latest.json, to keep append-only logs and today's CSV consistent.
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          git reset --hard --quiet "origin/${GITHUB_REF_NAME}"
          python3 scripts/should_poll.py

      # The only step whose failure should abort the run. What it writes --
      # raw/, derived/, status/ -- is unrecoverable if lost, because OpenRouter
      # reports only current windows and offers no historical endpoint.
      - name: Poll OpenRouter
        if: steps.guard.outputs.poll == 'true'
        run: python3 scripts/poll.py

      # README cosmetics only. A failure here must not discard a good poll, so
      # the commit below runs regardless: a stale README is rebuildable, a
      # missed observation is not.
      - name: Refresh README
        if: steps.guard.outputs.poll == 'true'
        continue-on-error: true
        run: |
          python3 scripts/summarize.py
          python3 scripts/readme_events.py

      - name: Commit
        if: steps.guard.outputs.poll == 'true'
        run: |
          set -euo pipefail
          git config user.name  "openrouter-uptime-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt})"
            git fetch --quiet origin "${GITHUB_REF_NAME}"

            # The usual reason for a rejection here is the other collector
            # landing its own poll while this one was working -- the guard
            # cleared at checkout, the race was lost at push. That makes this
            # sample redundant rather than lost: the window is already covered
            # by an observation seconds away from ours. Drop it and succeed,
            # which is what the Railway collector already does. Reported as a
            # failure, this fires the stale-collection alarm for a
            # non-problem, and a monitor that cries wolf gets ignored.
            if git show "origin/${GITHUB_REF_NAME}:status/latest.json" \
                 > /tmp/remote-latest.json 2>/dev/null \
               && LATEST_OVERRIDE=/tmp/remote-latest.json \
                  python3 scripts/should_poll.py | grep -q '^poll=false'; then
              echo "the other collector covered this window; dropping our sample"
              exit 0
            fi

            # Otherwise the remote moved for some other reason (a code push,
            # say), and rebasing is the right thing to try.
            echo "rebasing onto origin/${GITHUB_REF_NAME}"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "rebase conflicted and the window is not covered; failing"
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### poll"
            echo ""
            echo "- due: \`${{ steps.guard.outputs.poll }}\`"
            echo "- age of previous poll: \`${{ steps.guard.outputs.age_minutes }}\` min"
          } >> "$GITHUB_STEP_SUMMARY"

