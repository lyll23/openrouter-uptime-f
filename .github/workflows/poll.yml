name: poll

on:
  schedule:
    # Nominal 15-minute cadence, with the existing 12-minute duplicate guard.
    # GitHub can delay/drop scheduled events. This does not guarantee cadence.
    - cron: "7,22,37,52 * * * *"
    # Former liveness cadence: check first, recover within the same run.
    # Usually deduplicates against :22; if that attempt was missed, collect.
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/poll.yml"
      - "scripts/poll.py"
      - "scripts/should_poll.py"
      - "scripts/collection_health.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Poll even if the last one was recent"
        type: boolean
        default: false

# Never let two runs commit at once.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    # The former read-only liveness schedule now uses this existing writer;
    # no new token, permission scope, workflow_run chain, or second writer.
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Keep a small margin below the nominal 15-minute cadence so delayed
      # attempts are not needlessly suppressed.
      MIN_INTERVAL_MIN: "12"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Sparse checkout automatically fetches with blob:none. Historical
          # archives/CSVs are not needed to append today's observation.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /status/
            /README.md
            /.gitignore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh selected default-branch snapshot
        run: |
          # Include both dates in case the run crosses UTC midnight. Existing
          # rows for either date must be materialized before poll.py appends.
          today="$(date -u +%F)"
          tomorrow="$(date -u -d "${today} +1 day" +%F)"
          for day in "$today" "$tomorrow"; do
            git sparse-checkout add "/derived/${day}.csv" "/raw/${day}/"
          done
          # Refresh the whole selected snapshot before writing, not just
          # latest.json, to keep append-only logs and today's CSV consistent.
          git fetch --quiet origin "${DEFAULT_BRANCH}"
          git reset --hard --quiet "origin/${DEFAULT_BRANCH}"

      - name: Detect stale or invalid collection without a premature failure
        id: health
        run: python3 scripts/collection_health.py inspect --report "$RUNNER_TEMP/collection-before.json"

      - name: Is a poll due?
        id: guard
        env:
          FORCE_POLL: ${{ inputs.force || steps.health.outputs.recovery_needed == 'true' }}
        run: |
          # Both schedules use the same 12-minute floor. This also avoids
          # skipping at 59m59s and turning red at final validation without
          # ever attempting recovery as the sample crosses the 60m boundary.
          python3 scripts/should_poll.py

      # Collection, persistence, and final validation all fail closed. What
      # collection writes --
      # raw/, derived/, status/ -- is unrecoverable if lost, because OpenRouter
      # reports only current windows and offers no historical endpoint.
      - name: Poll OpenRouter
        id: collect
        if: steps.guard.outputs.poll == 'true'
        run: python3 scripts/poll.py

      # README cosmetics only. A failure here must not discard a good poll, so
      # the commit below runs regardless: a stale README is rebuildable, a
      # missed observation is not.
      - name: Refresh README
        if: steps.guard.outputs.poll == 'true'
        continue-on-error: true
        run: |
          python3 scripts/summarize.py
          python3 scripts/readme_events.py

      - name: Commit
        id: commit
        if: steps.guard.outputs.poll == 'true'
        run: |
          set -euo pipefail
          git config user.name  "openrouter-uptime-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt})"
            git fetch --quiet origin "${DEFAULT_BRANCH}"

            # The usual reason for a rejection here is the other collector
            # landing its own poll while this one was working -- the guard
            # cleared at checkout, the race was lost at push. That makes this
            # sample redundant rather than lost: the window is already covered
            # by an observation seconds away from ours. Drop it and succeed,
            # which is what the Railway collector already does. Reported as a
            # failure, this would alert for a redundant sample. The final
            # persisted validation still checks its actual content and age.
            if python3 scripts/collection_health.py verify \
                 --ref "origin/${DEFAULT_BRANCH}" --max-age 12 --candidate \
                 --before "$RUNNER_TEMP/collection-before.json" \
                 --report "$RUNNER_TEMP/collection-race.json"; then
              echo "the other collector covered this window; dropping our sample"
              exit 0
            fi

            # Otherwise the remote moved for some other reason (a code push,
            # say), and rebasing is the right thing to try.
            echo "rebasing onto origin/${DEFAULT_BRANCH}"
            if ! git pull --rebase origin "${DEFAULT_BRANCH}"; then
              git rebase --abort || true
              echo "rebase conflicted and the window is not covered; failing"
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Validate fresh sample persisted on the default branch
        id: verify
        # Still report persisted state after a failure; this cannot turn an
        # earlier failed step green. A skipped poll must pass validation too.
        if: ${{ !cancelled() }}
        env:
          POLL_DUE: ${{ steps.guard.outputs.poll }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$DEFAULT_BRANCH"
          # A due/recovery poll must establish a new recent sample; the old
          # 60-minute liveness limit cannot excuse a failed/no-op collection.
          limit=60
          advance=()
          if [[ "$POLL_DUE" == 'true' ]]; then
            limit=12
            advance=(--before "$RUNNER_TEMP/collection-before.json")
          fi
          python3 scripts/collection_health.py verify \
            --ref "origin/$DEFAULT_BRANCH" --max-age "$limit" "${advance[@]}" \
            --report "$RUNNER_TEMP/collection-after.json"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          POLL_DUE: ${{ steps.guard.outputs.poll }}
          POLL_RESULT: ${{ steps.collect.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          python3 scripts/collection_health.py summary \
            --before "$RUNNER_TEMP/collection-before.json" \
            --after "$RUNNER_TEMP/collection-after.json"
