name: liveness

# Check this repository's default branch, including in forks. GitHub cron is
# best-effort: a configured cadence is not evidence that collection happened.
# Keep the alarm separate from collection and publishing, so their failures
# cannot suppress the check. A failed check also gives poll.yml one recovery
# attempt; it is not a substitute for an independent reliable scheduler.

on:
  push:
    branches: [main]
    paths: [".github/workflows/liveness.yml"]
  schedule:
    # Avoid the busiest slot; scheduled runs can still be delayed or dropped.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Fail if the latest poll is older than this. Pass 0 to prove the check can fail."
        type: string
        default: "60"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Age of latest poll on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_AGE_MINUTES: ${{ inputs.max_age_minutes || '60' }}
        run: |
          python3 - <<'PY'
          import json, math, os, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone
          # No checkout: the public repository is >1 GB and this needs one file.
          # Raw CDN caching can add a few minutes; the threshold absorbs that.
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["DEFAULT_BRANCH"]
          url = ("https://raw.githubusercontent.com/"
                 f"{urllib.parse.quote(repo, safe='/')}/"
                 f"{urllib.parse.quote(branch, safe='')}/status/latest.json")
          limit = float(os.environ["MAX_AGE_MINUTES"])
          if not math.isfinite(limit) or limit < 0:
              sys.exit("::error::MAX_AGE_MINUTES must be finite and non-negative")
          print(f"checking {repo}@{branch}: {url}")
          with urllib.request.urlopen(url, timeout=30) as r:
              generated = json.load(r)["generated"]
          ts = datetime.fromisoformat(generated)
          if ts.tzinfo is None:
              sys.exit("::error::latest poll timestamp has no timezone")
          age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
          print(f"latest poll {generated}, {age:.1f} min ago (limit {limit:g} min)")
          if age < -5:
              sys.exit("::error::latest poll timestamp is in the future")
          if age > limit:
              sys.exit(f"::error::collector is silent: latest poll is {age:.0f} min "
                       f"old, limit {limit:g}. Check this repository's poll "
                       f"workflow and any independently configured collector.")
          PY

